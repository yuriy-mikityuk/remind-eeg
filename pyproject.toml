[build-system]
requires = ["setuptools==76.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remind-eeg"
dynamic = ["version"]
authors = [
    {name = "Yuriy Mikityuk"},
    # amused-py, the BLE layer in the top-level amused.py and muse_*.py modules
    {name = "Adrian Tadeusz Belmans", email = "adrian.belmans@gmail.com"},
]
description = "REM-gated targeted memory reactivation for the Muse S Athena EEG headset: overnight recording, real-time REM detection and safety-gated audio cues"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "muse",
    "eeg",
    "ppg",
    "fnirs",
    "biometrics",
    "neuroscience",
    "brain-computer-interface",
    "bci",
    "bluetooth",
    "ble",
    "biosignals",
    "heart-rate",
    "meditation",
    "sleep-monitoring"
]
dependencies = [
    "bleak>=0.21.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]

[project.scripts]
muse-tmr = "muse_tmr.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
openmuse = [
    "pylsl>=1.16",
]
brainflow = [
    "brainflow>=5.22.1",
]

[project.urls]
Homepage = "https://github.com/yuriy-mikityuk/remind-eeg"
Documentation = "https://github.com/yuriy-mikityuk/remind-eeg/blob/main/docs/USAGE.md"
Repository = "https://github.com/yuriy-mikityuk/remind-eeg"
Issues = "https://github.com/yuriy-mikityuk/remind-eeg/issues"

[tool.setuptools]
# amused.py is neither shipped nor mapped by an editable install: `amused` is the
# upstream package's name on PyPI, and the shim only serves `import amused` with the
# repository root on sys.path.
py-modules = [
    "muse_athena_protocol",
    "muse_data_parser",
    "muse_discovery",
    "muse_discovery_gui",
    "muse_exact_client",
    "muse_fnirs_processor",
    "muse_integrated_parser",
    "muse_ppg_heart_rate",
    "muse_raw_stream",
    "muse_realtime_decoder",
    "muse_replay",
    "muse_sleep_client",
    "muse_sleep_parser",
    "muse_stream_client",
    "muse_visualizer"
]
include-package-data = true

# The py-modules stay at the top level; the packages are found under src/.
[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["src"]
include = ["muse_tmr*"]

[tool.setuptools.dynamic]
version = {attr = "muse_tmr.__version__"}

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
"muse_tmr.app" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.muse_tmr.amused_py]
strategy = "forked-source"
pinned_upstream_remote = "https://github.com/Amused-EEG/amused-py"
pinned_upstream_ref = "bce20f98ddc7fa2efe3219d1b5d2f7554a55eb97"
local_policy = "Keep the BLE/data-source code in this repository until the REM-TMR layer is stable."
sync_policy = "Fetch upstream/main, review protocol changes, and port small patches intentionally."
contribution_policy = "Send general Muse BLE fixes upstream when they are not specific to the REM-TMR protocol."
