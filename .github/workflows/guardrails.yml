name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check forbidden files
        run: python scripts/check_forbidden_files.py
      - name: Check CLI scaffold
        run: PYTHONPATH=src python -m muse_tmr.cli.main --help

  # The Pythons of this matrix and of the package job are the ones pyproject.toml
  # claims in requires-python and its classifiers; tests/test_packaging.py keeps them equal.
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -rfEs \
            --cov=muse_tmr --cov-report=term-missing --cov-report=xml
      - name: Print the coverage total
        run: |
          total=$(python -m coverage report --format=total)
          echo "muse_tmr line coverage: ${total} %"
          echo "muse_tmr line coverage on ${{ matrix.os }}, Python ${{ matrix.python-version }}: ${total} %" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      # The glob also checks the distribution name: a wheel under any other name matches nothing.
      - name: Check the wheel has every file from src/muse_tmr
        run: python scripts/check_wheel.py dist/remind_eeg-*.whl
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$(cygpath -u "$RUNNER_TEMP")/wheel-env/Scripts"
          else
            bin="$RUNNER_TEMP/wheel-env/bin"
          fi
          echo "WHEEL_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/python" -m pip install dist/remind_eeg-*.whl
      - name: Run the CLI from the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$WHEEL_BIN/muse-tmr" --version
          "$WHEEL_BIN/python" -c "import importlib.metadata as md, muse_tmr; v = md.version('remind-eeg'); assert v == muse_tmr.__version__, (v, muse_tmr.__version__); print('remind-eeg', v)"
      - name: Run the demo from the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$WHEEL_BIN/muse-tmr" demo --hours 0.25 --no-open --output "$RUNNER_TEMP/wheel-demo"

  # A plumbing regression check on a synthetic night (synthetic input, not sleep). It
  # says nothing about REM detection: the cued plays come at sleep onset, not in REM.
  end_to_end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run the demo on a 2 h synthetic night
        run: |
          muse-tmr demo --hours 2 --no-open --output "$RUNNER_TEMP/demo" \
            --baseline tests/fixtures/synthetic/agreement_baseline.json
      - name: Check what the demo wrote
        run: |
          summary="$RUNNER_TEMP/demo/demo_summary.json"
          jq -e '.synthetic and .pilot1.passed and .pilot3.passed' "$summary"
          jq -e '.pilot3.uncued_puzzle_play_count == 0 and .pilot3.cue_plan_count >= 1' "$summary"
          jq -e '.pilot3.audio_backend == "mock" and (.pilot3.audio_playback_executed | not)' "$summary"
          jq -e '.baseline.mismatches == [] and ([.checks[]] | all)' "$summary"
          test -s "$RUNNER_TEMP/demo/report.html"
          grep -q "synthetic input, not sleep" "$RUNNER_TEMP/demo/report.html"
          jq -r '"raw_amused.bin sha256 \(.raw_sha256)"' "$summary"

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the app
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Open the page in headless Chrome
        run: |
          muse-tmr app --source mock --port 8799 > app.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fs http://127.0.0.1:8799/api/health > /dev/null && break; sleep 1; done
          node scripts/check_page.mjs http://127.0.0.1:8799/
      - name: Show the app log
        if: failure()
        run: cat app.log
